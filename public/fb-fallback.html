<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open in Browser</title>
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const osType = urlParams.get('os') || 'android';
            const origPathEncoded = urlParams.get('orig') || '';
            let dynamicLinkText = window.location.hostname;
            try {
                if (origPathEncoded) {
                    const decodedPath = atob(origPathEncoded);
                    const cleanPath = decodedPath.split('?')[0];
                    dynamicLinkText = window.location.hostname + cleanPath;
                }
            } catch (e) {
                dynamicLinkText = window.location.hostname;
            }
            if (osType === 'android') {
                const cleanParams = new URLSearchParams();
                cleanParams.set('dest', origPathEncoded);
                const cleanURL = window.location.pathname + '?' + cleanParams.toString() + window.location.hash;
                window.history.replaceState({}, document.title, cleanURL);
            }
            window.osType = osType;
            window.dynamicLinkText = dynamicLinkText;
        })();
    </script>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div style="background: #ffffff; padding: 36px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); text-align: center; max-width: 400px; width: 88%;">
        <h1 style="color: #0f172a; margin: 0 0 20px 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px;">Open in Browser</h1>
        <p style="color: #475569; font-size: 15px; line-height: 1.6; margin-bottom: 28px;">
            This website link: <strong id="target-slug-display" style="color: #0f172a; word-break: break-all;">domain.com/slug</strong> doesn't support the in-app browser, hence open in an external browser.
        </p>
        <div style="background: #f1f5f9; border: 1px solid #e2e8f0; padding: 18px; border-radius: 14px; text-align: left; font-size: 14px; color: #334155;">
            <p style="margin: 0 0 10px 0; font-weight: 700; color: #0f172a;">Follow these quick steps to continue:</p>
            <ol id="os-instructions" style="margin: 0; padding-left: 20px; line-height: 1.75; color: #334155;">
            </ol>
        </div>
    </div>
    <script>
        document.getElementById('target-slug-display').innerText = window.dynamicLinkText;
        const instEl = document.getElementById('os-instructions');
        if (window.osType === 'ios') {
            instEl.innerHTML = `
                <li>Tap the <strong>Three Dots (•••)</strong> or the native <strong>Share icon</strong> found on your navigation panel.</li>
                <li>Select the option <strong>"Open in Safari"</strong> from the actions list.</li>
            `;
        } else {
            instEl.innerHTML = `
                <li>Tap the <strong>Three Vertical Dots (⋮)</strong> located in the upper right-hand corner of your screen.</li>
                <li>Select the option <strong>"Open in Browser"</strong> or <strong>"Open in Chrome"</strong>.</li>
            `;
        }
    </script>
</body>
</html>
